<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TKC 2027 Research Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0c0f; --bg2:#0f1115; --panel:#14161b; --panel2:#1d2027; --line:#2a2e37;
    --text:#f4f5f7; --muted:#9aa1ad; --dim:#555a66;
    --red:#e4202d; --green:#1f9d55; --yellow:#e4e227; --blue:#2d6ca1;
    --head:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45}
  a{color:var(--text)}
  .stripe{display:flex;height:5px}.stripe i{flex:1}
  .stripe i:nth-child(1){background:var(--green)}.stripe i:nth-child(2){background:var(--yellow)}.stripe i:nth-child(3){background:var(--red)}.stripe i:nth-child(4){background:var(--blue)}
  header{background:#07080a;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  header .bar{max-width:1320px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  header img{height:30px}
  header h1{font-family:var(--head);font-style:italic;font-weight:800;text-transform:uppercase;font-size:24px;margin:0;flex:1;min-width:200px}
  header .who{color:var(--muted);font-size:13px}
  .btn{font-family:var(--head);font-style:italic;font-weight:800;text-transform:uppercase;font-size:15px;letter-spacing:.03em;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--text)}
  .btn.red{background:var(--red);border-color:var(--red)}
  main{max-width:1320px;margin:0 auto;padding:22px}
  .filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:20px}
  .filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  select,input[type=search]{background:var(--bg2);border:1px solid var(--line);color:var(--text);font:inherit;padding:9px 10px;min-width:180px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .kpi{background:var(--panel);border:1px solid var(--line);padding:16px;border-top:3px solid var(--line)}
  .kpi .v{font-family:var(--head);font-style:italic;font-weight:800;font-size:40px;line-height:1}
  .kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:6px}
  .kpi .s{color:var(--dim);font-size:12px;margin-top:2px}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);padding:18px;min-width:0}
  .card h2{font-family:var(--head);font-style:italic;font-weight:800;text-transform:uppercase;font-size:22px;margin:0 0 4px}
  .card .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}
  @media (max-width:1000px){.c8,.c6,.c4{grid-column:span 12}}
  table.rank{width:100%;border-collapse:collapse}
  table.rank th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
  table.rank td{padding:9px 8px;border-bottom:1px solid #1c1f26;vertical-align:middle}
  table.rank td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .barwrap{background:var(--bg2);height:14px;width:100%;min-width:80px;position:relative}
  .barwrap span{position:absolute;left:0;top:0;bottom:0;background:var(--yellow)}
  .rk{font-family:var(--head);font-style:italic;font-weight:800;color:var(--dim);width:26px}
  .dist .row{display:grid;grid-template-columns:minmax(110px,40%) 1fr 64px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
  .dist .row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dist .row .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  .dist .barwrap span{background:var(--blue)}
  .quotes{max-height:420px;overflow:auto;padding-right:6px}
  .quote{border-left:3px solid var(--line);padding:8px 12px;margin:0 0 10px;background:var(--bg2)}
  .quote .who{font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:600}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tabs button{font:inherit;font-weight:700;font-size:13px;background:var(--bg2);border:1px solid var(--line);color:var(--muted);padding:6px 12px;cursor:pointer}
  .tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
  .tablewrap{overflow:auto;max-height:560px;border:1px solid var(--line)}
  table.data{border-collapse:collapse;font-size:13px;min-width:100%}
  table.data th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:8px 10px;white-space:nowrap;font-size:12px;border-bottom:1px solid var(--line);cursor:pointer}
  table.data td{padding:7px 10px;border-bottom:1px solid #1c1f26;white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
  table.data tr:hover td{background:#171a20}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;text-transform:uppercase;letter-spacing:.04em}
  .tag.done{background:#123d26;color:#7ee2a5}.tag.part{background:#4a3a10;color:#f5d67a}
  .msg{padding:60px 20px;text-align:center;color:var(--muted)}
  .msg h2{font-family:var(--head);font-style:italic;text-transform:uppercase;color:var(--text);font-size:32px;margin:0 0 8px}
  .demo-banner{background:var(--yellow);color:#111;text-align:center;font-weight:700;font-size:13px;padding:6px;display:none}
  .split{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
  .dot{width:10px;height:10px;display:inline-block}
</style>
</head>
<body>
<div class="demo-banner" id="demoBanner">PREVIEW WITH DEMO DATA: once deployed this shows live responses from the Google Sheet</div>
<header>
  <div class="stripe"><i></i><i></i><i></i><i></i></div>
  <div class="bar">
    <img src="https://thekartchampionship.co.uk/wp-content/uploads/2026/10/tkc-logo.png" alt="The Kart Championship" onerror="this.style.display='none'">
    <h1>2027 Parent Research Dashboard</h1>
    <span class="who" id="who"></span>
    <button class="btn" id="refresh">Refresh</button>
    <button class="btn" id="csv">Export CSV</button>
    <a class="btn red" id="sheetLink" href="#" target="_blank" rel="noopener">Open Google Sheet</a>
  </div>
</header>

<main id="app"><div class="msg"><h2>Loading</h2>Pulling the latest responses&hellip;</div></main>

<script>
var RATINGS = [
  ["r_stream","Live streamed"],["r_tyres","Controlled tyres"],["r_msuk","Motorsport UK sanctioned"],
  ["r_biggrid","Big grid"],["r_owngrid","Own grid, not shared"],["r_officials","Stewards, Clerk and CCTV"],
  ["r_medical","Medical cover, multiple paramedics"],["r_scrutineering","Senior scrutineers and dyno"],
  ["r_tv","TV show setting (Driven Dreams)"],["r_social","Social media coverage"],
  ["r_title","British or national title"],["r_tracktime","Track time and races per weekend"],["r_practiceincl","Practice included in entry"]
];
var DATA = null, COLUMNS = null, F = {cls:"", raced:"", status:"Completed", q:""}, quoteTab = "liked", sortCol = "startedAt", sortDir = -1;

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function pct(a,b){ return b ? Math.round(a/b*100) : 0; }
function fmtDate(iso){ if(!iso) return ""; var d=new Date(iso); return isNaN(d)?String(iso):d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }

function load(){
  document.getElementById("app").innerHTML = '<div class="msg"><h2>Loading</h2>Pulling the latest responses&hellip;</div>';
  if (typeof google !== "undefined" && google.script && google.script.run){
    google.script.run.withSuccessHandler(onData).withFailureHandler(function(e){ onData({ok:false,error:String(e && e.message || e)}); }).getAdminData();
  } else {
    document.getElementById("demoBanner").style.display = "block";
    onData(demoData());
  }
}
function onData(res){
  if (!res || !res.ok){
    document.getElementById("app").innerHTML = '<div class="msg"><h2>No access</h2>'+esc(res && res.error || "Could not load data")+'</div>';
    return;
  }
  DATA = res.rows || []; COLUMNS = res.columns;
  DATA.forEach(function(r){ r.pcArea = (String(r.postcode||"").match(/^[A-Za-z]+/)||[""])[0].toUpperCase(); });
  document.getElementById("who").textContent = (res.user||"") + " · updated " + fmtDate(res.generatedAt);
  var link = document.getElementById("sheetLink");
  if (res.sheetUrl) link.href = res.sheetUrl; else link.style.display = "none";
  render();
}

function filtered(){
  return DATA.filter(function(r){
    if (F.status && r.status !== F.status) return false;
    if (F.cls && r.class2027 !== F.cls) return false;
    if (F.raced && r.racedTkc2026 !== F.raced) return false;
    return true;
  });
}
function count(rows, key, split){
  var m = {};
  rows.forEach(function(r){
    var v = r[key]; if (v===""||v==null) return;
    (split ? String(v).split(/;\s*/) : [String(v)]).forEach(function(x){ if(x) m[x]=(m[x]||0)+1; });
  });
  return Object.keys(m).map(function(k){return [k,m[k]];}).sort(function(a,b){return b[1]-a[1];});
}
function avg(rows, key){
  var s=0,n=0; rows.forEach(function(r){ var v=Number(r[key]); if(v>=1&&v<=10){s+=v;n++;} });
  return n? s/n : null;
}
function share(rows, key, min){
  var a=0,n=0; rows.forEach(function(r){ var v=Number(r[key]); if(v>=1&&v<=10){n++; if(v>=min)a++;} });
  return n? Math.round(a/n*100) : null;
}

function distCard(title, sub, rows, key, split, span, order){
  var c = count(rows, key, split);
  if (order) c.sort(function(a,b){ var x=order.indexOf(a[0]), y=order.indexOf(b[0]); return (x<0?99:x)-(y<0?99:y); });
  var total = split ? rows.filter(function(r){return r[key];}).length : c.reduce(function(s,x){return s+x[1];},0);
  var max = c.length ? Math.max.apply(null, c.map(function(x){return x[1];})) : 1;
  var body = c.length ? c.map(function(x){
    return '<div class="row"><div class="lab" title="'+esc(x[0])+'">'+esc(x[0])+'</div><div class="barwrap"><span style="width:'+(x[1]/max*100)+'%"></span></div><div class="n">'+x[1]+' · '+pct(x[1],total)+'%</div></div>';
  }).join("") : '<div class="sub">No answers yet</div>';
  return '<div class="card dist '+(span||"c4")+'"><h2>'+title+'</h2><div class="sub">'+sub+'</div>'+body+'</div>';
}

function render(){
  var all = DATA, rows = filtered();
  var completed = all.filter(function(r){return r.status==="Completed";}).length;
  var started = all.filter(function(r){return r.status==="Started";}).length;
  var raced = rows.filter(function(r){return r.racedTkc2026==="Yes";}).length;
  var signed = rows.filter(function(r){return r.signed2027==="Yes";}).length;
  var team = rows.filter(function(r){return r.team==="Yes";}).length;
  var dd = rows.filter(function(r){return r.drivenDreams==="Yes"||r.drivenDreams==="Maybe";}).length;
  var npsRows = rows.filter(function(r){ return r.nps!=="" && r.nps!=null && !isNaN(Number(r.nps)); });
  var prom = npsRows.filter(function(r){return Number(r.nps)>=9;}).length, det = npsRows.filter(function(r){return Number(r.nps)<=6;}).length;
  var npsScore = npsRows.length ? Math.round((prom-det)/npsRows.length*100) : null;
  var classes = count(all,"class2027").map(function(x){return x[0];});

  var h = '';
  h += '<div class="filters">'
    + '<label>Class 2027<select id="fCls"><option value="">All classes</option>'+classes.map(function(c){return '<option'+(F.cls===c?' selected':'')+'>'+esc(c)+'</option>';}).join("")+'</select></label>'
    + '<label>Raced TKC 2026<select id="fRaced"><option value="">Everyone</option><option'+(F.raced==="Yes"?' selected':'')+'>Yes</option><option'+(F.raced==="No"?' selected':'')+'>No</option></select></label>'
    + '<label>Status<select id="fStatus"><option value="Completed"'+(F.status==="Completed"?' selected':'')+'>Completed only</option><option value="Started"'+(F.status==="Started"?' selected':'')+'>Started, not finished</option><option value=""'+(F.status===""?' selected':'')+'>All</option></select></label>'
    + '<span class="sub" style="color:var(--muted);padding-bottom:10px">Showing '+rows.length+' of '+all.length+' responses</span></div>';

  h += '<div class="kpis">'
    + kpi(completed,"Completed","responses", "var(--green)")
    + kpi(started,"Started only","contact details, no answers","var(--yellow)")
    + kpi(pct(raced,rows.length)+"%","Raced TKC 2026",raced+" of "+rows.length,"var(--red)")
    + kpi(pct(signed,rows.length)+"%","Signed up 2027",signed+" of "+rows.length,"var(--blue)")
    + kpi(pct(team,rows.length)+"%","Run with a team",team+" of "+rows.length,"var(--line)")
    + kpi(pct(dd,rows.length)+"%","Open to Driven Dreams","yes or maybe","var(--line)")
    + kpi(npsScore==null?"n/a":(npsScore>0?"+":"")+npsScore,"Recommend score (NPS)",npsRows.length?prom+" promoters, "+det+" detractors of "+npsRows.length+" TKC 2026 racers":"TKC 2026 racers only","var(--yellow)")
    + '</div>';

  // What matters most
  var tkcRows = rows.filter(function(r){return r.racedTkc2026==="Yes";}), other = rows.filter(function(r){return r.racedTkc2026==="No";});
  var ranked = RATINGS.map(function(r){ return {k:r[0], l:r[1], a:avg(rows,r[0]), t:avg(tkcRows,r[0]), o:avg(other,r[0]), s:share(rows,r[0],8)}; })
    .sort(function(x,y){ return (y.a||0)-(x.a||0); });
  h += '<div class="grid"><div class="card c8"><h2>What matters most</h2><div class="sub">Average importance out of 10, highest first. "8+" is the share of parents who scored it 8, 9 or 10.</div>'
    + '<table class="rank"><thead><tr><th></th><th>Factor</th><th style="width:34%">Average</th><th class="num">Avg</th><th class="num">8+</th><th class="num">TKC 2026</th><th class="num">Others</th></tr></thead><tbody>'
    + ranked.map(function(x,i){ return '<tr><td class="rk">'+(i+1)+'</td><td>'+esc(x.l)+'</td><td><div class="barwrap"><span style="width:'+((x.a||0)*10)+'%"></span></div></td><td class="num"><b>'+(x.a==null?"n/a":x.a.toFixed(1))+'</b></td><td class="num">'+(x.s==null?"n/a":x.s+"%")+'</td><td class="num">'+(x.t==null?"n/a":x.t.toFixed(1))+'</td><td class="num">'+(x.o==null?"n/a":x.o.toFixed(1))+'</td></tr>'; }).join("")
    + '</tbody></table></div>';

  h += distCard("Racing instead","Parents not yet signed up for TKC 2027 (can pick several)", rows.filter(function(r){return r.signed2027==="Not yet";}), "racingInstead", true, "c4");
  h += distCard("Class 2026","", rows, "class2026");
  h += distCard("Class 2027","", rows, "class2027");
  h += distCard("Weekend format","2 day or 3 day", rows, "format");
  h += distCard("Motorsport UK or IKR","", rows, "sanction");
  h += distCard("Driven Dreams","Interest in taking part", rows, "drivenDreams");
  h += distCard("Signed up for TKC 2027","", rows, "signed2027");
  h += distCard("Also racing in 2027","Other series alongside TKC (can pick several)", rows, "alsoRacing", true);
  h += distCard("When events clash","What decides which one they go to", rows, "clashDecider");
  h += distCard("Season budget","Total 2027 spend: entries, tyres, testing, engines, travel", rows, "budget", false, "c4", ["Under £5,000","£5,000 to £10,000","£10,000 to £20,000","£20,000+"]);
  h += distCard("Race weekends a month","How many they would like to do", rows, "raceWeekends", false, "c4", ["1","2","3"]);
  h += distCard("Test days a month","How many they usually do", rows, "testDays", false, "c4", ["None","1","2","3","4 or more"]);
  h += distCard("Rounds or racing","Two rounds a weekend vs one round with superheats", rows, "roundFormat");
  h += distCard("Willing to travel","Per round", rows, "travel", false, "c4", ["Under 2 hours","2 to 4 hours","4 hours or more"]);
  h += distCard("Where they live","Postcode area", rows, "pcArea");

  // Voice of the parent
  var qmap = {liked:["liked2026","What they liked about TKC 2026"], disliked:["disliked2026","What they didn't like about TKC 2026"], why:["why","Why they're looking elsewhere"]};
  var qk = qmap[quoteTab][0];
  var qrows = rows.filter(function(r){return r[qk];});
  h += '<div class="card c8"><h2>In their words</h2><div class="tabs">'
    + Object.keys(qmap).map(function(k){ var n = rows.filter(function(r){return r[qmap[k][0]];}).length; return '<button data-q="'+k+'" class="'+(quoteTab===k?"on":"")+'">'+qmap[k][1]+' ('+n+')</button>'; }).join("")
    + '</div><div class="quotes">'
    + (qrows.length ? qrows.map(function(r){ return '<div class="quote"><div class="who">'+esc(r.parentName)+' · '+esc(r.driverName)+' · '+esc(r.class2027)+(qk==="why"&&r.racingInstead?' · looking at '+esc(r.racingInstead):'')+'</div>'+esc(r[qk])+(qk==="why"&&r.racingInsteadOther?'<div class="who" style="margin-top:4px">Other: '+esc(r.racingInsteadOther)+'</div>':'')+'</div>'; }).join("") : '<div class="sub">Nothing yet</div>')
    + '</div></div>';

  // Follow-up list
  var follow = all.filter(function(r){ return r.status==="Started" || r.signed2027==="Not yet"; });
  h += '<div class="card c4"><h2>Follow up</h2><div class="sub">Not signed for 2027, or stopped after step 1</div><div class="quotes">'
    + (follow.length ? follow.map(function(r){ return '<div class="quote" style="border-left-color:'+(r.status==="Started"?"var(--yellow)":"var(--red)")+'"><div class="who">'+(r.status==="Started"?"Did not finish":"Not signed yet")+' · '+fmtDate(r.startedAt)+'</div><b>'+esc(r.parentName)+'</b> ('+esc(r.driverName)+')<br><a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a> · <a href="tel:'+esc(String(r.phone).replace(/^'/,""))+'">'+esc(String(r.phone).replace(/^'/,""))+'</a></div>'; }).join("") : '<div class="sub">Nobody to chase yet</div>')
    + '</div></div>';

  // All responses
  h += '<div class="card c12"><h2>All responses</h2><div class="filters" style="margin:6px 0 12px"><input type="search" id="q" placeholder="Search name, email, driver, answers" value="'+esc(F.q)+'" style="min-width:320px"></div><div class="tablewrap" id="tableWrap">'+tableHtml(rows)+'</div></div>';
  h += '</div>';

  document.getElementById("app").innerHTML = h;
  bind();
}
function kpi(v,l,s,c){ return '<div class="kpi" style="border-top-color:'+c+'"><div class="v">'+v+'</div><div class="l">'+l+'</div><div class="s">'+s+'</div></div>'; }

function tableHtml(rows){
  var q = F.q.toLowerCase();
  var list = rows.filter(function(r){ return !q || COLUMNS.some(function(c){ return String(r[c[0]]||"").toLowerCase().indexOf(q)>-1; }); })
    .sort(function(a,b){ var x=a[sortCol]||"", y=b[sortCol]||""; return (x>y?1:x<y?-1:0)*sortDir; });
  var cols = COLUMNS.filter(function(c){ return c[0]!=="id"; });
  return '<table class="data"><thead><tr>'+cols.map(function(c){ return '<th data-sort="'+c[0]+'">'+esc(c[1])+(sortCol===c[0]?(sortDir>0?" ▲":" ▼"):"")+'</th>'; }).join("")+'</tr></thead><tbody>'
    + (list.length ? list.map(function(r){ return '<tr>'+cols.map(function(c){
        var v = r[c[0]];
        if (c[0]==="status") v = '<span class="tag '+(v==="Completed"?"done":"part")+'">'+esc(v)+'</span>';
        else if (c[0]==="startedAt"||c[0]==="completedAt") v = esc(fmtDate(v));
        else v = esc(String(v==null?"":v).replace(/^'/,""));
        return '<td title="'+esc(String(r[c[0]]==null?"":r[c[0]]))+'">'+v+'</td>'; }).join("")+'</tr>'; }).join("")
      : '<tr><td colspan="'+cols.length+'" style="color:var(--muted)">No matching responses</td></tr>')
    + '</tbody></table>';
}

function bind(){
  document.getElementById("fCls").onchange = function(){ F.cls = this.value; render(); };
  document.getElementById("fRaced").onchange = function(){ F.raced = this.value; render(); };
  document.getElementById("fStatus").onchange = function(){ F.status = this.value; render(); };
  document.querySelectorAll("[data-q]").forEach(function(b){ b.onclick = function(){ quoteTab = this.getAttribute("data-q"); render(); }; });
  var qi = document.getElementById("q");
  qi.oninput = function(){ F.q = this.value; document.getElementById("tableWrap").innerHTML = tableHtml(filtered()); bindSort(); };
  bindSort();
}
function bindSort(){
  document.querySelectorAll("th[data-sort]").forEach(function(th){ th.onclick = function(){ var k=this.getAttribute("data-sort"); if(sortCol===k) sortDir*=-1; else {sortCol=k; sortDir=1;} document.getElementById("tableWrap").innerHTML = tableHtml(filtered()); bindSort(); }; });
}

document.getElementById("refresh").onclick = load;
document.getElementById("csv").onclick = function(){
  if (!DATA) return;
  var rows = [COLUMNS.map(function(c){return c[1];})].concat(DATA.map(function(r){ return COLUMNS.map(function(c){ return r[c[0]]==null?"":r[c[0]]; }); }));
